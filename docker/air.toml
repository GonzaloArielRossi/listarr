root = "."
tmp_dir = "/tmp/listarr-air"

[build]
cmd = "go build -trimpath -buildvcs=false -o /tmp/listarr-air/wishlist ."
entrypoint = ["/tmp/listarr-air/wishlist"]
include_ext = ["go", "mod", "sum", "html", "css", "js", "svg"]
exclude_dir = ["data", "listarr-data"]
exclude_regex = ["_test\\.go$"]
poll = true
poll_interval = 1000
delay = 500
send_interrupt = true
kill_delay = "5s"
stop_on_error = false
