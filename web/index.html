<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Listaar</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Listaar</div>
      <nav class="views" aria-label="Library">
        <button class="button secondary" id="show-wishlist" type="button" aria-pressed="true">Wishlist</button>
        <button class="button secondary" id="show-archive" type="button" aria-pressed="false">Archive</button>
      </nav>
    </header>

    <main>
      <h1 id="view-title" class="sr-only">Wishlist</h1>

      <section aria-labelledby="view-title">
        <div class="toolbar" id="wishlist-filters">
          <form class="title-search" id="title-search" role="search">
            <label class="search-field">
              <span class="search-icon" aria-hidden="true"></span>
              <span class="sr-only">Search wishlist or TMDB by title or ID</span>
              <input id="filter-title" type="search" placeholder="Search by title or ID" maxlength="256" autocomplete="off" required>
            </label>
            <button class="button primary" id="search-tmdb" type="submit" disabled>Search TMDB</button>
          </form>
          <div class="type-filters" role="group" aria-label="Filter by title type">
            <button class="button secondary" type="button" data-kind="movie" aria-pressed="false">Films</button>
            <button class="button secondary" type="button" data-kind="tv" aria-pressed="false">Shows</button>
          </div>
          <label class="select-field">
            <span class="sr-only">Original language</span>
            <select id="filter-language"><option value="">All original languages</option></select>
          </label>
        </div>
        <div class="results-toolbar">
          <p class="list-summary" id="summary" aria-live="polite">Loading wishlist…</p>
          <div class="display-controls">
            <div class="layout-switch" role="group" aria-label="Display layout">
              <button class="button secondary" type="button" data-layout="grid" aria-pressed="true" aria-controls="cards">Grid</button>
              <button class="button secondary" type="button" data-layout="list" aria-pressed="false" aria-controls="cards">List</button>
            </div>
            <label class="select-field grid-size" id="grid-size">
              <span class="sr-only">Cards per row</span>
              <select id="grid-columns" aria-controls="cards">
                <option value="4">4 per row</option>
                <option value="5">5 per row</option>
                <option value="6" selected>6 per row</option>
              </select>
            </label>
            <button class="button danger" id="clear-archive" type="button" hidden disabled>Clear archive</button>
          </div>
        </div>
        <p class="notice" id="list-error" role="alert" hidden></p>
        <ul class="cards" id="cards" data-layout="grid" data-columns="6"></ul>

        <div class="empty" id="empty" hidden>
          <div class="poster-stack" aria-hidden="true"><span></span><span></span><span><i></i></span></div>
          <h2 id="empty-title">Your wishlist is empty</h2>
          <p id="empty-detail">Search TMDB to add your first title.</p>
          <button class="button secondary" id="reset-filters" type="button" hidden>Clear filters</button>
        </div>
        <p class="sr-only" id="feedback" role="status"></p>
      </section>
    </main>

    <footer aria-label="Credits">
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer"><img src="/tmdb.svg" alt="TMDB" width="60" height="16"></a>
      <p>This product uses the TMDB API but is not endorsed or certified by TMDB.<br>Streaming availability provided by <a class="credit-link" href="https://www.justwatch.com/" target="_blank" rel="noopener noreferrer">JustWatch</a>.</p>
    </footer>
  </div>

  <dialog id="lookup" aria-labelledby="lookup-title">
    <div class="dialog-heading">
      <h2 id="lookup-title">TMDB results</h2>
      <form method="dialog"><button class="icon-button close" aria-label="Close TMDB results" type="submit" autofocus>×</button></form>
    </div>
    <p id="lookup-status" class="lookup-status" role="status"></p>
    <p id="lookup-error" class="notice" role="alert" hidden></p>
    <ul id="lookup-results" class="results"></ul>
    <div id="pages" class="pages" hidden>
      <button id="previous-page" class="button secondary" type="button">Previous</button>
      <span id="page-number"></span>
      <button id="next-page" class="button secondary" type="button">Next</button>
    </div>
  </dialog>

  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-detail">
    <div class="dialog-heading">
      <h2 id="confirm-title"></h2>
    </div>
    <p id="confirm-detail"></p>
    <form method="dialog" class="confirm-actions">
      <button class="button secondary" type="submit" value="cancel" autofocus>Cancel</button>
      <button class="button danger" id="confirm-action" type="submit" value="confirm"></button>
    </form>
  </dialog>
</body>
</html>
