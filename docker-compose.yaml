services:
  listarr:
    build: .
    image: film-wishlist:local
    container_name: listarr
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      PUID: 1000
      PGID: 1000
    ports:
      - "${WISHLIST_PORT:-8080}:8080"
    volumes:
      - ./listarr-data:/data
    #read_only: true
    restart: unless-stopped
    networks:
       - proxy-network

networks:
  proxy-network:
    external: true
